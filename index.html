<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Arena FPS</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; font-family: Arial, sans-serif; touch-action:none; }
  canvas { display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; color:#fff; user-select:none; }
  #crosshair {
    position:absolute; top:50%; left:50%; width:6px; height:6px;
    background:#fff; border-radius:50%; transform:translate(-50%,-50%);
    box-shadow: 0 0 4px #000;
  }
  #health { position:absolute; bottom:20px; left:20px; font-size:26px; font-weight:bold; text-shadow: 0 0 4px #000; }
  #ammo { position:absolute; bottom:20px; right:20px; font-size:26px; font-weight:bold; text-shadow: 0 0 4px #000; }
  #currentWeaponLabel { position:absolute; bottom:52px; right:20px; font-size:14px; opacity:0.8; text-shadow: 0 0 4px #000; }
  #killfeed { position:absolute; top:20px; right:20px; text-align:right; font-size:13px; }
  #killfeed div { background:rgba(0,0,0,0.55); padding:4px 8px; margin-bottom:4px; border-radius:4px; }
  #scoreboard {
    position:absolute; top:20px; left:20px; font-size:13px;
    background:rgba(0,0,0,0.5); padding:8px 12px; border-radius:4px; min-width:170px;
  }
  .teamBlue { color:#5dade2; }
  .teamRed { color:#e74c3c; }

  #startScreen {
    position:fixed; inset:0; background:rgba(0,0,0,0.92); color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:20;
    text-align:center; padding:20px;
  }
  #startScreen input {
    padding:10px; font-size:16px; border-radius:6px; border:none; width:220px; text-align:center;
  }
  .teamChoice { display:flex; gap:12px; }
  .teamChoice button {
    padding:12px 22px; font-size:16px; border-radius:8px; border:2px solid transparent;
    cursor:pointer; font-weight:bold;
  }
  #teamBlueBtn { background:#3498db; color:#fff; }
  #teamRedBtn { background:#e74c3c; color:#fff; }
  .teamChoice button.selected { border-color:#f1c40f; }
  #playBtn {
    padding:14px 30px; font-size:18px; border-radius:8px; border:none;
    background:#2ecc71; color:#fff; cursor:pointer; font-weight:bold;
  }
  #deathScreen {
    position:fixed; inset:0; background:rgba(150,0,0,0.35); color:#fff;
    display:none; align-items:center; justify-content:center; font-size:30px; font-weight:bold; z-index:15;
    text-align:center;
  }

  /* ---- Mobil kontroller ---- */
  #mobileControls { display:none; position:fixed; inset:0; z-index:8; }
  #joystickZone { position:absolute; left:0; top:0; bottom:190px; width:50%; pointer-events:auto; touch-action:none; }
  #lookZone { position:absolute; right:0; top:0; bottom:190px; width:50%; pointer-events:auto; touch-action:none; }

  /* Joystick artık HER ZAMAN aynı yerde sabit ve görünür */
  #joystickBase {
    position:absolute; left:40px; bottom:40px; width:110px; height:110px; border-radius:50%;
    background:rgba(255,255,255,0.18); border:2px solid rgba(255,255,255,0.35);
  }
  #joystickKnob {
    position:absolute; width:50px; height:50px; border-radius:50%;
    background:rgba(255,255,255,0.55); top:30px; left:30px;
  }

  #fireBtn {
    position:absolute; right:26px; bottom:150px; width:80px; height:80px; border-radius:50%;
    background:rgba(231,76,60,0.55); border:2px solid rgba(255,255,255,0.4);
    display:flex; align-items:center; justify-content:center; font-size:28px; pointer-events:auto; touch-action:none;
  }
  #reloadBtn {
    position:absolute; right:120px; bottom:170px; width:56px; height:56px; border-radius:50%;
    background:rgba(0,0,0,0.5); border:2px solid rgba(255,255,255,0.4); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:20px; pointer-events:auto; touch-action:none;
  }
  #runBtn {
    position:absolute; left:26px; top:26px; width:56px; height:56px; border-radius:50%;
    background:rgba(0,0,0,0.5); border:2px solid rgba(255,255,255,0.4); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:22px; pointer-events:auto; touch-action:none;
  }
  #runBtn.active { background:rgba(46,204,113,0.6); }

  /* Basılı tutunca açılan silah seçme menüsü */
  #weaponSelectBtn {
    position:absolute; right:120px; bottom:80px; width:60px; height:60px; border-radius:50%;
    background:rgba(0,0,0,0.55); border:2px solid rgba(255,255,255,0.45); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:22px; pointer-events:auto; touch-action:none;
  }
  #weaponPopup {
    position:absolute; right:90px; bottom:150px; display:none; flex-direction:column; gap:6px;
  }
  .weaponOption {
    width:64px; height:56px; border-radius:10px; background:rgba(0,0,0,0.8);
    border:2px solid rgba(255,255,255,0.35); color:#fff; font-size:13px; font-weight:bold;
    display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:auto;
  }
  .weaponOption .icon { font-size:20px; }
  .weaponOption.hover { border-color:#f1c40f; background:rgba(90,65,0,0.9); transform:scale(1.08); }
</style>
</head>
<body>
<div id="startScreen">
  <h1>🔫 Arena FPS</h1>
  <input id="nameInput" placeholder="İsmini gir" maxlength="16" />
  <div class="teamChoice">
    <button id="teamBlueBtn">🔵 Mavi Takım</button>
    <button id="teamRedBtn">🔴 Kırmızı Takım</button>
  </div>
  <button id="playBtn">OYNA</button>
  <p style="max-width:320px">
    Bilgisayar: WASD hareket, fare bak, sol tık ateş, Shift koş, R doldur, 1/2/3/4 silah değiştir<br/>
    Mobil: sol taraf joystick, sağ taraf bakış, alt sağ ateş, silah ikonunu basılı tutup seç
  </p>
</div>
<div id="deathScreen">ÖLDÜN<br/><span style="font-size:18px">Yeniden doğuyorsun...</span></div>

<div id="hud">
  <div id="crosshair"></div>
  <div id="health">❤️ 100</div>
  <div id="ammo">🔫 12/12</div>
  <div id="currentWeaponLabel">Tabanca</div>
  <div id="killfeed"></div>
  <div id="scoreboard"><b>Skor Tablosu</b><div id="scoreList"></div></div>
</div>

<div id="mobileControls">
  <div id="joystickZone">
    <div id="joystickBase"><div id="joystickKnob"></div></div>
  </div>
  <div id="lookZone"></div>
  <div id="runBtn">🏃</div>
  <div id="reloadBtn">🔄</div>
  <div id="fireBtn">🔥</div>
  <div id="weaponSelectBtn">🔫</div>
  <div id="weaponPopup">
    <div class="weaponOption" data-weapon="ak47"><span class="icon">🪖</span>AK47</div>
    <div class="weaponOption" data-weapon="m4"><span class="icon">🎯</span>M4</div>
    <div class="weaponOption" data-weapon="pistol"><span class="icon">🔫</span>Tabanca</div>
    <div class="weaponOption" data-weapon="knife"><span class="icon">🔪</span>Bıçak</div>
  </div>
</div>

<script>
  window.GAME_SERVER_URL = "wss://arena-fps-server-production.up.railway.app";
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module" src="/main.js"></script>
</body>
</html>
